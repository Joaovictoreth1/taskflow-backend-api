name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.11", database: sqlite}
          - {python: "3.12", database: postgres}
    services:
      postgres:
        image: ${{ matrix.database == 'postgres' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: taskflow_ci
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: taskflow_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U taskflow_ci -d taskflow_ci"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: make install
      - run: make lint typecheck audit
      - run: make test
        env:
          TEST_POSTGRES_URL: ${{ matrix.database == 'postgres' && format('postgresql+psycopg://taskflow_ci:local-ci-only@127.0.0.1:{0}/taskflow_ci', job.services.postgres.ports[5432]) || '' }}

  container:
    name: Production Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: make smoke
